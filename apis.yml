aid: bloom-institute-of-technology
name: Bloom Institute of Technology
description: 'Bloom Institute of Technology (formerly Lambda School) is an online coding
  bootcamp founded in 2017 that trains learners for AI-driven tech careers through part-time
  and full-time programs in Full Stack Web Development, Backend Development, and Data
  Science, plus corporate "AI for Developer Productivity" training. It is known for its
  income-share and deferred-tuition model ($0 upfront with a job-contingent payment plan)
  and a tuition-refund guarantee. The company reports 4,000+ graduates since 2017. It
  is a venture-backed consumer education company (backed by GV) and is tracked in the
  API Evangelist network as a company profile; it does not currently publish a public
  developer API surface.'
